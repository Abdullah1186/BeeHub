[project]
name = "beehub-api"
version = "0.1.0"
description = "BeeHub — Arabic learning hub backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",   # multipart PDF upload
    "supabase>=2.10",
    "psycopg[binary]>=3.2",       # worker job queue + migrations
    "anthropic>=1.7",             # 1.x major: built on httpx2, not httpx
    "voyageai>=0.3",
    "pymupdf>=1.24",              # Arabic extraction; see plan §2
    "pyyaml>=6.0",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",  # Supabase JWT verification
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-recording>=0.13",     # eval cassettes (Tier 1)
    "httpx>=0.27",                # fastapi TestClient
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the real Anthropic API and costs money (Tier 2/3; deselected by default)",
]
# Tier 0 + Tier 1 must pass with no network and no API key.
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
