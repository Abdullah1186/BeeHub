# Tier 0 + Tier 1: runs on every push and PR. Costs nothing.
#
# No API key is available to this workflow, and that is deliberate — it cannot
# spend money even by accident. Tier 0 is pure logic; Tier 1 replays recorded
# cassettes. If a PR touches skills/, the prompt hash changes, the cassettes
# miss, and the eval job below refuses rather than silently passing.

name: tests

on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:

jobs:
  tier0:
    name: Tier 0 — unit tests (free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: apps/api
        # No ANTHROPIC_API_KEY in the environment: anything that tries to call
        # the API fails loudly instead of quietly billing us.
        run: python -m pytest -q

  gate:
    name: Position gate (SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: beehub
          POSTGRES_DB: beehub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          PGPASSWORD: beehub
        run: |
          psql -h localhost -U postgres -d beehub -q -f supabase/local/auth_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $(basename "$f")"
            psql -h localhost -U postgres -d beehub -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Position gate and grounding tests
        env:
          PGPASSWORD: beehub
        # The §5.2 guarantee, checked against a real database: 1000 random
        # selections, cross-user isolation, position rollback, and the
        # grounding constraint that was once silently inert.
        run: psql -h localhost -U postgres -d beehub -v ON_ERROR_STOP=1 -q -f supabase/tests/gate_test.sql

  evals:
    name: Tier 1 — evals (cassette replay, free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Replay evals against recorded cassettes
        # No --live, and no API key. A skills/ change invalidates the cassettes
        # by hash, so this job fails and tells the author to re-record with
        # `make eval-live` rather than letting an unmeasured prompt through.
        run: python evals/runner.py --suite all
